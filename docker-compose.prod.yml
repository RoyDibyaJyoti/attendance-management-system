# ==============================================================================
# AMCS Production Docker Compose
# Services:
#   1. amcs-postgres: PostgreSQL 16 Alpine persistent database
#   2. amcs-backend:  Spring Boot 3.3.3 / Java 21 non-root backend service
#   3. amcs-frontend: Hardened Nginx 1.27 reverse proxy & React SPA server
# ==============================================================================

services:
  amcs-postgres:
    image: postgres:16-alpine
    container_name: amcs-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - amcs_prod_postgres_data:/var/lib/postgresql/data
    networks:
      - amcs-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  amcs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amcs-backend-prod
    restart: unless-stopped
    depends_on:
      amcs-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:postgresql://amcs-postgres:5432/${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      AMCS_JWT_SECRET: "${AMCS_JWT_SECRET}"
      AMCS_JWT_ISSUER: "${AMCS_JWT_ISSUER:-amcs-auth-service}"
      AMCS_JWT_EXPIRATION_SECONDS: "${AMCS_JWT_EXPIRATION_SECONDS:-3600}"
      AMCS_CORS_ALLOWED_ORIGINS: "${AMCS_CORS_ALLOWED_ORIGINS:-https://amcs.university.edu}"
      AMCS_BOOTSTRAP_ENABLED: "${AMCS_BOOTSTRAP_ENABLED:-false}"
      SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE: "${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:-20}"
      SPRING_DATASOURCE_HIKARI_MIN_IDLE: "${SPRING_DATASOURCE_HIKARI_MIN_IDLE:-5}"
    networks:
      - amcs-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  amcs-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amcs-frontend-prod
    restart: unless-stopped
    depends_on:
      amcs-backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - amcs-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  amcs_prod_postgres_data:
    name: amcs_prod_postgres_data

networks:
  amcs-prod-network:
    name: amcs-prod-network
    driver: bridge
