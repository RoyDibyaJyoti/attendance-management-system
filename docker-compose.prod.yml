# ==============================================================================
# AMCS Production Docker Compose
# Services: PostgreSQL 16 Alpine + AMCS Java 21 Backend
# ==============================================================================
version: '3.8'

services:
  amcs-postgres:
    image: postgres:16-alpine
    container_name: amcs-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-amcs_db}"
      POSTGRES_USER: "${POSTGRES_USER:-amcs_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-amcs_production_secret_change_in_prod}"
    volumes:
      - amcs_prod_postgres_data:/var/lib/postgresql/data
    networks:
      - amcs-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amcs_user} -d ${POSTGRES_DB:-amcs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  amcs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amcs-backend-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      amcs-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:postgresql://amcs-postgres:5432/${POSTGRES_DB:-amcs_db}"
      POSTGRES_USER: "${POSTGRES_USER:-amcs_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-amcs_production_secret_change_in_prod}"
      AMCS_JWT_SECRET: "${AMCS_JWT_SECRET:-production-super-secret-jwt-key-minimum-256-bits-length-32-bytes!}"
      AMCS_JWT_ISSUER: "${AMCS_JWT_ISSUER:-amcs-auth-service}"
      AMCS_CORS_ALLOWED_ORIGINS: "${AMCS_CORS_ALLOWED_ORIGINS:-https://amcs.university.edu}"
      SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE: "${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:-20}"
      SPRING_DATASOURCE_HIKARI_MIN_IDLE: "${SPRING_DATASOURCE_HIKARI_MIN_IDLE:-5}"
    networks:
      - amcs-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  amcs_prod_postgres_data:
    name: amcs_prod_postgres_data

networks:
  amcs-prod-network:
    name: amcs-prod-network
    driver: bridge
