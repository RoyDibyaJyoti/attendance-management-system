spring:
  application:
    name: amcs-test

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
    com.amcs: DEBUG
