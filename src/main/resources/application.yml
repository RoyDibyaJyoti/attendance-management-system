spring:
  application:
    name: attendance-management-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amcs_db}
    username: ${POSTGRES_USER:amcs_user}
    password: ${POSTGRES_PASSWORD:amcs_secret_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

amcs:
  security:
    jwt:
      secret: ${AMCS_JWT_SECRET:dev-secret-key-for-amcs-local-testing-must-be-at-least-256-bits-long-32-bytes!}
      issuer: ${AMCS_JWT_ISSUER:amcs-auth-service}
      expiration-seconds: ${AMCS_JWT_EXPIRATION_SECONDS:3600}
    bcrypt:
      strength: 12
    lockout:
      max-failed-attempts: 5
      duration-seconds: 900
