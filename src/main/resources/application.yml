spring:
  application:
    name: attendance-management-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amcs_db}
    username: ${POSTGRES_USER:amcs_user}
    password: ${POSTGRES_PASSWORD:amcs_secret_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true

server:
  port: 8080

amcs:
  jwt:
    secret: ${JWT_SECRET:amcs-v2-dev-secret-key-must-be-at-least-32-characters-long!}
    expiration-seconds: ${JWT_EXPIRY:86400}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://[::1]:5173}
