version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: amcs-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-amcs_db}"
      POSTGRES_USER: "${POSTGRES_USER:-amcs_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-amcs_secret_password}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amcs_user} -d ${POSTGRES_DB:-amcs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: amcs_postgres_data
